server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Clickjacking protection (pentest #1): the app must not be shown inside another site's iframe.
    # "always" also covers error responses. Any location that sets its own add_header must repeat these.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
