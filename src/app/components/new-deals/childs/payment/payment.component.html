<div class="wrapper">
  <ng-container *ngIf="!isMainLoading">
    <div class="info-list">
      <div class="info-box order_info_cont">
        <div class="left">
          <p class="brand_name">
            {{ transaction?.merchantName }}
          </p>
          <p class="price" *ngIf="transaction.amount != 0">
            {{ transaction?.amount }} {{ transaction?.currency | currencySymbol }}
          </p>
          <input
            *ngIf="transaction.amount == 0"
            [ngClass]="{ 'amount-error': amountError }"
            type="text"
            class="price"
            suffix=" ֏"
            mask="separator.2"
            thousandSeparator=","
            [(ngModel)]="changedAmount"
            (ngModelChange)="checkAmount()"
            placeholder="{{ 'deals.enteramount' | translate }}"
          />
        </div>
        <div class="right">
          <ng-container *ngIf="!transaction || !transaction.logo || transaction.logo.trim() === ''">
            <svg
              width="56"
              height="56"
              viewBox="0 0 56 56"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              xmlns:xlink="http://www.w3.org/1999/xlink"
            >
              <rect
                id="Logo"
                x="0.5"
                y="0.5"
                width="55"
                height="55"
                rx="7.5"
                fill="url(#pattern0)"
                stroke="#CCD6E6"
              />
              <defs>
                <pattern
                  id="pattern0"
                  patternContentUnits="objectBoundingBox"
                  width="1"
                  height="1"
                >
                  <use
                    xlink:href="#image0_198_1166"
                    transform="scale(0.015625)"
                  />
                </pattern>
                <image
                  id="image0_198_1166"
                  data-name="Checker.png"
                  width="64"
                  height="64"
                  xlink:href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAYAAACqaXHeAAAAAXNSR0IArs4c6QAAAONJREFUeF7t20EOhEAIRFG4/6F7DvEnYeFzryQIv6pBd2behOu9dPvsbog+k+NLgArQAqmJcw9iAAhSgZKB3IJkkAySQTJ4CiE+gA8oBeg0mH3Ai084P89HhqwEqIA209ICsQdjAeaZIgaAYKxBDMCAYy8fXwAIgiAIcoJpJEYGI4VjB3YrbC9gL2AvkCB43cM5PgZgAAZgQFnNZAhdGykQBEEQBEEQDBmgAm2glM/z+QUYisYUGoldO7kY32IEAzCg6RgIRgjFAsw+AgRBMNYgBmCAT2TCYfoPPz/HCqQCX1eBHzHnv7C7WhBSAAAAAElFTkSuQmCC"
                />
              </defs>
            </svg>
          </ng-container>
          <ng-container *ngIf="transaction && transaction.logo && transaction.logo.trim() !== ''">
            <img
              [src]="replaceConverseImgLink(transaction?.logo)"
              alt="Merchant logo"
            />
          </ng-container>
        </div>
      </div>

      <ng-container *ngIf="transaction.canChangeComment">
        <div class="info-box converse_pay_cont">
          <p class="converse_pay_title">{{ "deals.comment" | translate }}</p>
          <input
            class="converse_pay_des"
            type="text"
            name=""
            id=""
            [(ngModel)]="newComment"
            placeholder="{{ 'deals.entercomment' | translate }}"
            (ngModelChange)="changeCommentFoo()"
          />
        </div>
      </ng-container>

      <ng-container *ngIf="!transaction.canChangeComment">
        <div
          class="info-box converse_pay_cont"
          *ngIf="transaction.comment.trim() != ''"
        >
          <p class="converse_pay_title">{{ "deals.comment" | translate }}</p>
          <p class="converse_pay_des">
            {{ transaction?.comment }}
          </p>
        </div>
      </ng-container>

      <div *ngIf="!onlyApplePay" class="info-box pay_card_cont">
        <!-- <p>{{ "deals.PAY_WITH_CARD" | translate }}</p> -->
        <button (click)="payByCard()">
          <mat-spinner *ngIf="isSmallLoading" [diameter]="20"></mat-spinner>
          <p *ngIf="!isSmallLoading" class="btn_text">
            {{ "deals.PAY_CARD" | translate }}
          </p>
        </button>
      </div>

      <div
        *ngIf="showApplePayButton"
        class="info-box apple-pay-cont"
        style="width: 100%"
      >
        <div class="apple-pay" style="width: 100%">
          <app-apple-pay
            style="width: 100%"
            [merchantId]="merchantInfo.merchant"
            [transactionHash]="transferId"
            [transactionAmount]="transaction.amount"
            [transactionComment]="transaction.comment"
            [canRedirectToURL]="canRedirectToURL"
            [currency]="transaction.currency"
            (onApplePayCompleted)="onApplePayCompleted($event)"
          ></app-apple-pay>
        </div>
      </div>
